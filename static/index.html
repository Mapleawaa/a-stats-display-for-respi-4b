<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树莓派显示屏控制器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen text-white">
    <div class="container mx-auto px-4 py-8">
        <!-- 标题栏 -->
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                🍓 树莓派显示屏控制器
            </h1>
            <p class="text-center text-gray-400">ST7789V3 显示屏远程控制系统</p>
            <div class="flex justify-center items-center mt-4 space-x-4">
                <div class="flex items-center">
                    <span class="w-3 h-3 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                    <span id="connection-status" class="text-sm">服务器连接中...</span>
                </div>
                <div class="text-sm text-gray-400">
                    分辨率: <span id="display-resolution">280x240</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧控制面板 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 快速操作卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">⚡</span>
                        快速操作
                    </h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button onclick="displayTime()" class="control-btn bg-blue-600 hover:bg-blue-700">
                            🕐 显示时间
                        </button>
                        <button onclick="displaySystemInfo()" class="control-btn bg-green-600 hover:bg-green-700">
                            💻 系统状态
                        </button>
                        <button onclick="clearDisplay()" class="control-btn bg-red-600 hover:bg-red-700">
                            🗑️ 清空屏幕
                        </button>
                        <button onclick="refreshStatus()" class="control-btn bg-purple-600 hover:bg-purple-700">
                            🔄 刷新状态
                        </button>
                    </div>
                </div>

                <!-- 文本输入卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">✏️</span>
                        文本显示
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">单行文本</label>
                            <div class="flex space-x-2">
                                <input type="text" id="text-input" placeholder="输入要显示的文本..."
                                       class="flex-1 px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <button onclick="displayText()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors">
                                    发送
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">多行文本(每行一段)</label>
                            <textarea id="multiline-input" rows="4" placeholder="第一行&#10;第二行&#10;第三行..."
                                      class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                            <button onclick="displayMultilineText()" class="mt-2 w-full px-6 py-3 bg-green-600 hover:bg-green-700 rounded-lg font-medium transition-colors">
                                发送多行文本
                            </button>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">字体大小</label>
                                <select id="text-scale" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                                    <option value="1">小 (1x)</option>
                                    <option value="2" selected>中 (2x)</option>
                                    <option value="3">大 (3x)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">文本颜色</label>
                                <select id="text-color" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
                                    <option value="0xFFFFFF">白色</option>
                                    <option value="0xFF0000">红色</option>
                                    <option value="0x00FF00">绿色</option>
                                    <option value="0x0000FF">蓝色</option>
                                    <option value="0xFFFF00">黄色</option>
                                    <option value="0xFF00FF">紫色</option>
                                    <option value="0x00FFFF">青色</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 图片上传卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">🖼️</span>
                        图片显示
                    </h2>
                    <div class="space-y-4">
                        <div class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center hover:border-blue-500 transition-colors">
                            <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="previewImage(event)">
                            <label for="image-upload" class="cursor-pointer">
                                <div class="text-4xl mb-2">📁</div>
                                <p class="text-gray-400">点击选择图片</p>
                                <p class="text-sm text-gray-500 mt-2">支持 PNG, JPG, BMP, GIF (最大5MB)</p>
                            </label>
                        </div>
                        <div id="image-preview" class="hidden">
                            <img id="preview-img" class="w-full rounded-lg border border-gray-600 mb-2">
                            <button onclick="uploadImage()" class="w-full px-6 py-3 bg-purple-600 hover:bg-purple-700 rounded-lg font-medium transition-colors">
                                上传并显示
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 亮度控制卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">💡</span>
                        背光控制
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">亮度: <span id="brightness-value">50%</span></label>
                            <input type="range" id="brightness-slider" min="1" max="100" value="50"
                                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                                   oninput="updateBrightnessLabel(this.value)">
                        </div>
                        <button onclick="setBrightness()" class="w-full px-6 py-3 bg-yellow-600 hover:bg-yellow-700 rounded-lg font-medium transition-colors">
                            设置亮度
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右侧状态面板 -->
            <div class="space-y-6">
                <!-- 当前状态卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">📊</span>
                        当前状态
                    </h2>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between py-2 border-b border-gray-700">
                            <span class="text-gray-400">显示模式:</span>
                            <span id="current-mode" class="font-mono text-green-400">idle</span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-700">
                            <span class="text-gray-400">旋转角度:</span>
                            <span id="rotation" class="font-mono">90°</span>
                        </div>
                        <div class="flex justify-between py-2 border-b border-gray-700">
                            <span class="text-gray-400">当前亮度:</span>
                            <span id="current-brightness" class="font-mono">50%</span>
                        </div>
                        <div class="flex justify-between py-2">
                            <span class="text-gray-400">最后更新:</span>
                            <span id="last-update" class="font-mono text-xs">未更新</span>
                        </div>
                    </div>
                </div>

                <!-- 系统信息卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">🖥️</span>
                        树莓派状态
                    </h2>
                    <div id="system-info" class="space-y-3 text-sm">
                        <div class="text-gray-400 text-center py-4">
                            点击"系统状态"按钮获取信息
                        </div>
                    </div>
                </div>

                <!-- 操作日志卡片 -->
                <div class="bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center">
                        <span class="mr-2">📝</span>
                        操作日志
                    </h2>
                    <div id="log-container" class="space-y-2 max-h-64 overflow-y-auto text-xs font-mono">
                        <div class="text-gray-500">等待操作...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>树莓派ST7789显示屏控制系统 v1.0.0</p>
            <p class="mt-1">基于 FastAPI + Adafruit CircuitPython ST7789</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
