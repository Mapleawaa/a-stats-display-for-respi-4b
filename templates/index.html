<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树莓派信息屏控制器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>树莓派信息屏控制器</h1>
            <div class="connection-status" id="connectionStatus">
                连接状态: <span id="statusIndicator">未知</span>
            </div>
        </header>

        <main>
            <div class="control-panel">
                <div class="panel-section">
                    <h2>控制面板</h2>
                    
                    <div class="button-group">
                        <button id="showTimeBtn" class="action-btn">显示时间</button>
                        <button id="showSysInfoBtn" class="action-btn">显示系统状态</button>
                        <button id="showWeatherBtn" class="action-btn">显示天气</button>
                        <button id="clearScreenBtn" class="action-btn danger">清屏</button>
                    </div>
                    
                    <div class="text-input-section">
                        <label for="customText">自定义文本:</label>
                        <textarea id="customText" placeholder="输入要在屏幕上显示的文本..."></textarea>
                        <button id="sendTextBtn" class="action-btn">发送到屏幕</button>
                    </div>
                    
                    <div class="image-upload-section">
                        <label for="imageUpload">上传图片:</label>
                        <input type="file" id="imageUpload" accept="image/*">
                        <button id="uploadImageBtn" class="action-btn">上传并显示</button>
                    </div>
                    
                    <div class="color-picker-section">
                        <label for="textColorPicker">文本颜色:</label>
                        <input type="color" id="textColorPicker" value="#ffffff">
                    </div>
                </div>
                
                <div class="status-panel">
                    <h2>状态信息</h2>
                    <div id="statusMessages">
                        <p>准备就绪...</p>
                    </div>
                    <div id="currentScreen" class="current-screen-preview">
                        当前显示: <span id="currentMode">空闲</span>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>树莓派 ST7789V3 信息显示屏系统 | 当前IP: <span id="ipAddress">加载中...</span></p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
